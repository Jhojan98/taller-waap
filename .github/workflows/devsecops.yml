name: devsecops-pipeline # Fase 5 (PDF p.14). Gate: SAST, SCA, contenedor, IaC, DAST.
permissions:
  contents: read
on: [push, pull_request]
jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/owasp-top-ten app/ waap/ --error
      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          pip-audit -r waap/ml/requirements.txt
      - name: Build de la imagen de la aplicacion
        run: docker build -t taller-waap/app:${{ github.sha }} ./app
      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'taller-waap/app:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: IaC scan - Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          quiet: true
      - name: DAST - OWASP ZAP baseline
        # Tolerante: en el runner no hay stack vivo (:8080 solo existe en el lab local;
        # el DAST real se evidencia en evidencias/fase6/). El resto del gate es estricto.
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
      - name: Despliegue de reglas WAAP (solo si todo pasa)
        if: success()
        run: ./scripts/deploy_waap_rules.sh
